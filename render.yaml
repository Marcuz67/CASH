services:
  - type: web
    name: cash
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        value: https://cash-rqu6.onrender.com
      - key: ADMIN_SETUP_TOKEN
        sync: false
